[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owui-mcp-spawner"
# Single source of truth: app/__init__.py:__version__
dynamic = ["version"]
description = "Spawn OpenWebUI tool JSONs as isolated Model Context Protocol (MCP) servers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "mcp>=1.0.0,<2",  # 2.x rebuilt the low-level Server API the runner uses
    "packaging>=24.0",
    "starlette>=0.36.0",
    "httpx>=0.27.0",
]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
